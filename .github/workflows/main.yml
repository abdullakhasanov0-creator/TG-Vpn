name: Build APK
on:
  push:
  workflow_dispatch:

env:
  TG_API_ID: "ВСТАВЬ_ЧИСЛО"
  TG_API_HASH: "ВСТАВЬ_ХЭШ"

defaults:
  run:
    working-directory: limonchik-tg-vpn

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать проект
        working-directory: .
        run: unzip -q "$(ls *.zip | head -n1)"
      - name: Исправить код под новый TDLib
        run: |
          python3 - <<'EOF'
          import re
          p = 'core/src/main/kotlin/dev/limonchik/tgvpn/core/TgClient.kt'
          s = open(p, encoding='utf-8').read()
          s = s.replace('private val proxy: ProxyConfig', 'private val cfg: ProxyConfig')
          new = '''client.send(TdApi.AddProxy().apply {
                      proxy = TdApi.Proxy().apply {
                          server = "127.0.0.1"
                          port = cfg.socksPort
                          type = TdApi.ProxyTypeSocks5(cfg.user, cfg.pass)
                      }
                      enable = true
                  }) { report(it) }'''
          s = re.sub(r'client\.send\(TdApi\.AddProxy\(\)\.apply \{.*?\}\) \{ report\(it\) \}', lambda m: new, s, flags=re.S)
          assert 'TdApi.Proxy()' in s
          open(p, 'w', encoding='utf-8').write(s)
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Скачать ядро Xray
        run: |
          mkdir -p libs
          curl -fL https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar -o libs/libv2ray.aar
      - name: Ключи Telegram API
        run: |
          printf '%s\n' "TG_API_ID=$TG_API_ID" "TG_API_HASH=$TG_API_HASH" > local.properties
      - name: Сборка
        run: gradle :app-phone:assembleDebug :app-watch:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-phone
          path: limonchik-tg-vpn/app-phone/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-watch
          path: limonchik-tg-vpn/app-watch/build/outputs/apk/debug/*.apk
